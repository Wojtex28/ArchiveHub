name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Testy
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowanie obrazu
        run: docker build -t archivehub:ci .
      - name: Start i healthcheck
        run: |
          docker run -d --name ah -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e ARCHIVEHUB_SSL_REDIRECT=0 \
            archivehub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs ah
          exit 1
