# ArchiveHub: aplikacja + Caddy, opcjonalnie Cloudflare Tunnel.
#   docker compose up -d --build                    lokalnie: http://localhost:8080
#   docker compose --profile tunnel up -d --build   na serwerze, z tunelem

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    image: archivehub:latest
    env_file: .env
    volumes:
      - data:/data
      - static:/srv/static
    environment:
      # Panel pokazuje tę ścieżkę; sam udział czyta tylko worker.
      ARCHIVEHUB_IMPORT_DIR: /import
    # Twarde limity pamięci: przy braku RAM-u na serwerze OOM trafi w ten kontener, a nie w NAS.
    mem_limit: ${ARCHIVEHUB_APP_MEMORY:-768m}
    restart: unless-stopped
    logging: *logging

  # Import albumów z udziału sieciowego: ten sam obraz, osobny proces.
  # Udział jest podpięty tylko do odczytu, więc aplikacja niczego w nim nie zmieni.
  worker:
    image: archivehub:latest
    command: ["python", "manage.py", "import_worker"]
    # Start jako root tylko po to, żeby entrypoint ustawił właściciela folderu kopii;
    # sam worker działa potem jako zwykły użytkownik archivehub.
    user: root
    env_file: .env
    environment:
      ARCHIVEHUB_IMPORT_DIR: /import
      # Migracje robi już kontener app.
      ARCHIVEHUB_SKIP_SETUP: "1"
      ARCHIVEHUB_BACKUP_DIR: /kopie
    volumes:
      - data:/data
      - ${ARCHIVEHUB_IMPORT_PATH:-./import}:/import:ro
      # Codzienne kopie bazy: katalog na serwerze, objęty snapshotami ZFS i kopią na Drive.
      - ${ARCHIVEHUB_BACKUP_PATH:-./kopie}:/kopie
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/data/import-worker.heartbeat') < 600 else 1)"
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Konwersja dużego skanu potrzebuje sporo pamięci; limit chroni NAS.
    mem_limit: ${ARCHIVEHUB_WORKER_MEMORY:-1g}
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARCHIVEHUB_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  static:
