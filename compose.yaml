# ArchiveHub: aplikacja + Caddy, opcjonalnie Cloudflare Tunnel.
#   docker compose up -d --build                    lokalnie: http://localhost:8080
#   docker compose --profile tunnel up -d --build   na serwerze, z tunelem

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    image: archivehub:latest
    env_file: .env
    volumes:
      - data:/data
      - static:/srv/static
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARCHIVEHUB_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
    restart: unless-stopped
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  static:
