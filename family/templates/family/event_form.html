{% extends "app_base.html" %}
{% block title %}Zdarzenie: {{ person.name }} · {{ site_title }}{% endblock %}
{% block main %}
<p><a href="{% url 'family:person' person.pk %}#chronologia">← {{ person.name }}</a></p>
<h1>Zdarzenie z życia</h1>
<form method="post" class="card card--form">
  {% csrf_token %}
  {% include "family/includes/event_fields.html" %}
  <button type="submit" class="button">Zapisz</button>
</form>
{% endblock %}
