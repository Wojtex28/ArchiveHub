{% load l10n %}{% if photo %}<span class="tree-avatar tree-avatar--photo{% if large %} tree-avatar--large{% endif %}"><img class="rot-{{ photo.pending_front }}" src="{% url 'albums:thumb' photo.pk %}?v={{ photo.version_front }}" alt="" loading="lazy" data-portrait data-x="{{ person.portrait_x|unlocalize }}" data-y="{{ person.portrait_y|unlocalize }}" data-zoom="{{ person.portrait_zoom|unlocalize }}"></span>{% else %}<span class="tree-avatar tree-avatar--empty{% if large %} tree-avatar--large{% endif %}" aria-hidden="true">{{ person.name|slice:":1" }}</span>{% endif %}
