{% if photo %}<img class="tree-avatar{% if large %} tree-avatar--large{% endif %} rot-{{ photo.pending_front }}" src="{% url 'albums:thumb' photo.pk %}?v={{ photo.version_front }}" alt="" loading="lazy">{% else %}<span class="tree-avatar tree-avatar--empty{% if large %} tree-avatar--large{% endif %}" aria-hidden="true">{{ person.name|slice:":1" }}</span>{% endif %}
